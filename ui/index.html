<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>device-search</title>
<!--
  ⚠️ NO FRAMEWORK, NO BUILD STEP. This is a search box, a result list and a settings line.
  React would add a toolchain, a lockfile and a dependency tree to render about 40 elements.
  ⚠️ And a build step would mean the packaged app contains code nobody can read directly —
  which defeats the point of a project meant to be legible.
-->
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ⚠️ A DRAG REGION. The window is frameless, so without this it cannot be moved at all —
       and macOS users expect to be able to reposition a floating search box. -->
  <div id="drag"></div>

  <div id="box">
    <div id="searchrow">
      <svg id="icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="6.5" />
        <line x1="15.2" y1="15.2" x2="21" y2="21" />
      </svg>
      <input id="q" type="text" autocomplete="off" spellcheck="false"
             placeholder="Search or ask a question for anything on this device… " />
      <!-- ⚠⚠ THE ANSWER TOGGLE, WHICH IS WHAT MAKES THE FEATURE REACHABLE AT ALL.
           The LLM path existed on the command line and nowhere in the interface, so a user
           could not turn it on, could not see that it was off, and had no reason to know it
           was there. ⚠️ IT IS HIDDEN UNTIL A KEY IS SAVED — offering a switch whose only
           outcome is an error is worse than not offering it. -->
      <button id="askbtn" title="answer the question (uses your connected model)"
              style="display:none">answer</button>
      <kbd id="esc">esc</kbd>
    </div>

    <!-- ⚠️ STATUS IS ALWAYS VISIBLE, EVEN WHEN EMPTY. The whole failure mode this project
         keeps recording is a tool that looks like it is working while measuring nothing.
         If the daemon is down or the index is partial, that has to be on screen. -->
    <!-- ⚠️ ABOVE the results, not below them. A caveat underneath a list reads as a footnote;
         the same sentence above it qualifies what follows. -->
    <!-- ⚠️ ONE COMPONENT SHOWS STATUS, NOT THREE. banner + status + setup used to stack above
         the results, and each one that appeared pushed the list further down the window. -->
    <div id="banner">
      <div id="banner-text"></div>
      <!-- ⚠️ A REAL BAR, driven by the daemon's own percentage. A spinner says "something is
           happening"; a bar says "12% done, 8 minutes left", and only the second tells a user
           whether to wait or go and do something else. -->
      <div id="banner-bar"><div id="banner-fill"></div></div>
    </div>

    <div id="status"></div>

    <div id="results"></div>

    <div id="foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
      <span><kbd>↵</kbd> open</span>
      <span><kbd>⌘↵</kbd> reveal</span>
      <span id="settings" title="choose folders (⌘,)">folders</span>
      <span id="activity"></span>
      <span id="indexinfo"></span>
    </div>
  </div>

<!-- ⚠️⚠️ SETUP IS AN OVERLAY, AND THAT IS A BUG FIX RATHER THAN A STYLE CHOICE.
     It used to be a `flex: 1` sibling between the status line and the results, so whenever it
     was shown it took HALF THE WINDOW — and when it was shown but EMPTY, because /api/roots
     failed or had not answered, that half was a blank box that pushed every result down.
     ⚠️ An overlay cannot affect the layout of what it covers. That is the whole point. -->
<div id="setup-overlay"><div id="setup"></div></div>

<!-- ⚠️ setup.js loads FIRST: app.js calls Setup.open() during boot. -->
<script src="setup.js"></script>
<script src="app.js"></script>
</body>
</html>
